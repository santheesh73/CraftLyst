name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["20", "22"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install dev dependencies
        run: npm ci --no-audit --no-fund
      - name: Lint
        run: npm run lint
      - name: Type-check (tsc --checkJs)
        run: npm run typecheck
      - name: Install Chromium for Tier 2 tests (version pinned by package-lock.json)
        run: npx playwright install --with-deps chromium
      - name: Unit tests
        run: npm test
      - name: Validate schemas, SKILL.md frontmatter and line count
        run: npm run validate
      - name: Catalog validation, license gate, index and NOTICE.md up to date
        run: npm run catalog
      - name: Build package and verify checksums
        run: |
          npm run package
          npm run verify-package

  installer:
    name: Installer ${{ matrix.os }} Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ["20", "22"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install dev dependencies
        run: npm ci --no-audit --no-fund
      - name: Validate adapters
        run: node scripts/generate-agent-docs.js --check
      - name: Installer tests and packaged-install end to end
        run: node --test scripts/test/installer.test.js scripts/test/installer-e2e.test.js
