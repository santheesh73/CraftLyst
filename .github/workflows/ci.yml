name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["20", "22"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install dev dependencies
        run: npm ci --no-audit --no-fund
      - name: Lint
        run: npm run lint
      - name: Type-check (tsc --checkJs)
        run: npm run typecheck
      - name: Install Chromium for Tier 2 tests (version pinned by package-lock.json)
        run: npx playwright install --with-deps chromium
      - name: Unit tests
        run: npm test
      - name: Validate schemas, SKILL.md frontmatter and line count
        run: npm run validate
      - name: Build package and verify checksums
        run: |
          npm run package
          npm run verify-package
